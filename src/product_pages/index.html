<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Details</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product.js" type="module"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="product-detail">
        <h3 data-product="brand"></h3>
        <h2 class="divider" data-product="name"></h2>
        <img class="divider" data-product="image" src="" alt="" />
        <p class="product-card__price" data-product="price"></p>
        <p class="product__color" data-product="color"></p>
        <p class="product__description" data-product="description"></p>
        <div class="product-detail__add">
          <button id="addToCart" type="button">Add to Cart</button>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
