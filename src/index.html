<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="newsletter">
        <h2>Stay Updated</h2>
        <p>Sign up to receive news about new gear and special offers.</p>
        <form id="newsletterForm">
          <input
            type="email"
            id="newsletterEmail"
            placeholder="Enter your email"
            required
          />
          <button type="submit">Sign Up</button>
        </form>
        <p id="newsletterMessage" hidden>Thanks for signing up!</p>
      </section>

      <section class="products" aria-labelledby="category-heading">
        <h2 id="category-heading">Shop by Category</h2>
        <ul class="category-list">
          <li class="category-card">
            <a href="/product_listing/?category=tents">
              <img src="/images/categories/tents.svg" alt="Tents" />
              <span aria-hidden="true">Tents</span>
            </a>
          </li>
          <li class="category-card">
            <a href="/product_listing/?category=backpacks">
              <img src="/images/categories/backpacks.svg" alt="Backpacks" />
              <span aria-hidden="true">Backpacks</span>
            </a>
          </li>
          <li class="category-card">
            <a href="/product_listing/?category=sleeping-bags">
              <img src="/images/categories/sleeping-bags.svg" alt="Sleeping bags" />
              <span aria-hidden="true">Sleeping Bags</span>
            </a>
          </li>
          <li class="category-card">
            <a href="/product_listing/?category=hammocks">
              <img src="/images/categories/hammocks.svg" alt="Hammocks" />
              <span aria-hidden="true">Hammocks</span>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer id="main-footer"></footer>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
