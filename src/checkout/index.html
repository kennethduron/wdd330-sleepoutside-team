<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout">
        <h2>Review & Place your Order</h2>

        <form id="checkout-form">
          <fieldset>
            <legend>Customer Information</legend>

            <label for="fname">First Name</label>
            <input
              type="text"
              id="fname"
              name="fname"
              autocomplete="given-name"
              maxlength="50"
              required
            />

            <label for="lname">Last Name</label>
            <input
              type="text"
              id="lname"
              name="lname"
              autocomplete="family-name"
              maxlength="50"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Shipping Address</legend>

            <label for="street">Street Address</label>
            <input
              type="text"
              id="street"
              name="street"
              autocomplete="street-address"
              maxlength="100"
              required
            />

            <label for="city">City</label>
            <input
              type="text"
              id="city"
              name="city"
              autocomplete="address-level2"
              maxlength="60"
              required
            />

            <label for="state">State</label>
            <input
              type="text"
              id="state"
              name="state"
              autocomplete="address-level1"
              maxlength="2"
              required
            />

            <label for="zip">Zip Code</label>
            <input
              type="text"
              id="zip"
              name="zip"
              autocomplete="postal-code"
              inputmode="numeric"
              maxlength="10"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>

            <label for="cardNumber">Credit Card Number</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              autocomplete="cc-number"
              inputmode="numeric"
              pattern="[0-9]{13,19}"
              maxlength="19"
              required
            />

            <label for="expiration">Expiration Date</label>
            <input
              type="text"
              id="expiration"
              name="expiration"
              placeholder="MM/YY"
              autocomplete="cc-exp"
              inputmode="numeric"
              pattern="(0[1-9]|1[0-2])/[0-9]{2}"
              maxlength="5"
              required
            />

            <label for="code">Security Code</label>
            <input
              type="text"
              id="code"
              name="code"
              autocomplete="cc-csc"
              inputmode="numeric"
              pattern="[0-9]{3,4}"
              maxlength="4"
              required
            />
          </fieldset>

          <button type="submit">Checkout</button>
        </form>

        <section class="order-summary">
          <h3>Order Summary</h3>
          <p>Subtotal: <span id="subtotal">$0.00</span></p>
          <p>Tax: <span id="tax">$0.00</span></p>
          <p>Shipping: <span id="shipping">$0.00</span></p>
          <p>Order Total: <span id="order-total">$0.00</span></p>
        </section>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
